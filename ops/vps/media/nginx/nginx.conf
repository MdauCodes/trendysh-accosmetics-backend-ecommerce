# The only NBH container on the shared proxy network. It does three jobs:
#  1. img.trendyshaccosmetic.com: pretty photo addresses turned into imgproxy requests, with a disk cache in front,
#       /o/<key>        the stored photo as it was uploaded (the original, unprocessed)
#       /w<width>/<key> a copy at that width, WebP (only the widths imgproxy has presets for)
#     a photo not in the bucket yet is a 302 to the same photo on Cloudinary (account dhgwijhdu), so the move never shows a blank
#  2. s3.trendyshaccosmetic.com: the bucket's S3 API (Garage), for the backend to store and delete photos (it needs its access key)
#  3. nothing else: any other host or path answers 404.
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
  # Docker's own resolver, so a restarted container with a new address is found again without restarting nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;

  log_format main '$remote_addr "$host $request" $status $body_bytes_sent $upstream_cache_status $request_time';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # The proxy in front (Traefik) is the only thing that can reach this container: take the shopper's address from it.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  real_ip_header X-Forwarded-For;

  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=photos:64m max_size=10g inactive=90d use_temp_path=off;

  server {
    listen 80 default_server;
    server_name _;
    location = /healthz { return 200 "ok\n"; }
    location / { return 404; }
  }

  server {
    listen 80;
    server_name img.trendyshaccosmetic.com;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /healthz { return 200 "ok\n"; }

    set $imgproxy "nbh-imgproxy:8080";

    # The stored photo as it is (imgproxy's raw preset: no processing, streamed from the bucket).
    location ~ ^/o/(?<photo_key>.+)$ {
      rewrite ^/o/(.*)$ /_/o/plain/s3://nbh-media/$1 break;
      proxy_pass http://$imgproxy;
      include /etc/nginx/nbh/photo-cache.conf;
      proxy_intercept_errors on;
      error_page 404 = @cloudinary_original;
    }

    # A copy at a width the shop uses: only the widths imgproxy has presets for (install.sh); any other width is a plain 404.
    location ~ ^/w(?<photo_width>64|72|96|128|160|200|240|320|360|400|480|640|720|960|1080|1280|1440|1600|1920|2560|3840)/(?<photo_key>.+)$ {
      rewrite ^/(w[0-9]+)/(.*)$ /_/$1/plain/s3://nbh-media/$2@webp break;
      proxy_pass http://$imgproxy;
      include /etc/nginx/nbh/photo-cache.conf;
      proxy_intercept_errors on;
      error_page 404 = @cloudinary_copy;
    }

    # A photo not in the bucket yet (uploaded to Cloudinary after the last copy): the browser is sent to the same photo on
    # Cloudinary (account dhgwijhdu), resized the way the shop asked for it before the move, so no picture is ever blank.
    # no-store: once the photo is copied, the next visit gets ours.
    location @cloudinary_copy {
      add_header Access-Control-Allow-Origin "*" always;
      add_header Cache-Control "no-store" always;
      return 302 https://res.cloudinary.com/dhgwijhdu/image/upload/w_$photo_width,c_limit,q_auto,f_auto/$photo_key;
    }
    location @cloudinary_original {
      add_header Access-Control-Allow-Origin "*" always;
      add_header Cache-Control "no-store" always;
      return 302 https://res.cloudinary.com/dhgwijhdu/image/upload/$photo_key;
    }

    location / { return 404; }
  }

  # Moments Packaging (added 29 Oct 2026): same photo addresses, served from the "moments" bucket.
  # The "moments-docs" bucket (customer documents) is deliberately not reachable from here.
  server {
    listen 80;
    server_name img.momentspackaging.com;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /healthz { return 200 "ok
"; }

    set $imgproxy "nbh-imgproxy:8080";

    location ~ ^/o/(.+)$ {
      rewrite ^/o/(.*)$ /_/o/plain/s3://moments/$1 break;
      proxy_pass http://$imgproxy;
      include /etc/nginx/nbh/photo-cache.conf;
    }

    location ~ ^/w([0-9]+)/(.+)$ {
      rewrite ^/(w[0-9]+)/(.*)$ /_/$1/plain/s3://moments/$2@webp break;
      proxy_pass http://$imgproxy;
      include /etc/nginx/nbh/photo-cache.conf;
    }

    location / { return 404; }
  }

  server {
    listen 80;
    server_name s3.trendyshaccosmetic.com;

    client_max_body_size 200m;
    location = /healthz { return 200 "ok\n"; }

    location / {
      set $garage "nbh-garage:3900";
      proxy_pass http://$garage;
      # The request is signed for exactly this host name: pass it on untouched.
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }
  }
}
